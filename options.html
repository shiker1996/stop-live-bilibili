<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Stop Pay · 设置</title>
<style>
  body {
    font-family: system-ui, "Microsoft YaHei", sans-serif;
    color: #18191c;
    background: #f5f6f7;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 460px;
    max-width: 100%;
    background: #fff;
    border-radius: 12px;
    padding: 28px 32px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 20px;
  }
  .field {
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: #4e5969;
  }
  .field input[type="number"] {
    width: 120px;
    padding: 8px 10px;
    border: 1px solid #e3e5e7;
    border-radius: 6px;
    font-size: 14px;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .check input {
    width: 16px;
    height: 16px;
  }
  button {
    background: #00a1d6;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 28px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover {
    background: #00b3e5;
  }
  #status {
    margin-left: 12px;
    font-size: 13px;
    color: #2eb872;
  }
  .note {
    font-size: 12px;
    color: #9499a0;
    line-height: 1.8;
    margin: 20px 0 0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Stop Pay 设置</h1>

    <div class="field">
      <label class="check">
        <input type="checkbox" id="enabled" />
        <span>启用拦截</span>
      </label>
    </div>

    <div class="field">
      <label for="cooldown">劝退冷静期（秒）</label>
      <input type="number" id="cooldown" min="0" max="60" />
    </div>

    <div class="field">
      <label class="check">
        <input type="checkbox" id="bypass" />
        <span>允许「仍然要支付」按钮（放行 60 秒）</span>
      </label>
    </div>

    <button id="save">保存</button>
    <span id="status"></span>

    <p class="note">
      提示：插件在网络层拦截 pay.bilibili.com 及下单接口，并在页面上拦截「充值 / 开通 / 充电 /
      送礼物」等付费入口，弹出劝退提醒。关闭拦截后所有规则立即失效。
    </p>
  </div>
<script src="options.js"></script>
</body>
</html>
